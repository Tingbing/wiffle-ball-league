<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WBL</title>
 <script>
  (async function () {
    let latest = "app.v.4.html";

    const incomingSearch = new URLSearchParams(location.search);
    const incomingHash = location.hash || "";

    let navType = "navigate";
    try {
      const navEntry = performance.getEntriesByType?.("navigation")?.[0];
      if (navEntry?.type) navType = navEntry.type;
      else if (performance.navigation) {
        if (performance.navigation.type === 1) navType = "reload";
        else if (performance.navigation.type === 2) navType = "back_forward";
      }
    } catch (e) {}

    try {
      const res = await fetch("latest.json?cb=" + Date.now(), { cache: "no-store" });
      if (res.ok) {
        const j = await res.json();
        if (j && typeof j.latest === "string" && j.latest.trim()) {
          latest = j.latest.trim();
        }
      }
    } catch (e) {}

    const target = new URL(latest, location.href);

    for (const [k, v] of incomingSearch.entries()) {
      target.searchParams.set(k, v);
    }

    target.searchParams.set("t", String(Date.now()));

    if (navType === "reload") {
      target.searchParams.set("__wbl_boot", "reload");
    } else {
      target.searchParams.delete("__wbl_boot");
    }

    target.hash = incomingHash;
    location.replace(target.toString());
  })();
</script>
</head>
<body></body>
</html>
