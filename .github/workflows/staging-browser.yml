name: Staging browser acceptance
on:
  push:
    branches: [codex/league-setup-security-2026-10-10]
    paths: ['*.js', '*.html', '*.css', 'tests/**', 'package.json', 'package-lock.json', '.github/workflows/staging-browser.yml']
permissions:
  contents: read
concurrency:
  group: staging-browser
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Baseline and custom rules
        run: node --test tests/*.test.cjs
      - name: Install pinned browser test dependency
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop, mobile and two-device staging checks
        run: node tests/browser.cjs
      - name: Retain screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-setup-evidence
          path: |
            tests/setup-*.png
            tests/BROWSER_RESULTS.md
