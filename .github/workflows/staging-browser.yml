name: Staging browser acceptance
on:
  push:
    branches: [codex/multi-league-2026-10-09]
    paths: ['*.js', '*.html', '*.css', 'tests/**', '.github/workflows/staging-browser.yml']
permissions:
  contents: read
concurrency:
  group: staging-browser
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Baseline and custom rules
        run: node --test tests/*.test.cjs
      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.64.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop, mobile and two-device staging checks
        run: node tests/browser.cjs
